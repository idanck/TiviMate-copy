<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שידור טלפון — נגן פודקאסט</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="studio-phone.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="st-screen st-amb-tone" dir="rtl">
<div aria-hidden="true" class="st-amb-x" style="position: absolute; left: -120px; top: -80px; width: 560px; height: 560px; pointer-events: none">
<div class="st-amb-y" style="width: 100%; height: 100%"><div style="width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, var(--st-halo) 0%, rgba(70,112,196,0.14) 34%, rgba(70,112,196,0) 66%)"></div></div>
</div>

<header style="position: absolute; top: var(--st-safe-top); right: var(--st-safe-x); left: var(--st-safe-x); height: 56px; display: flex; align-items: center; gap: 10px">
<button aria-label="סגירת הנגן" class="st-glass-thin" style="width: var(--st-touch); height: var(--st-touch); flex: 0 0 var(--st-touch); border: 0; border-radius: 50%; color: var(--st-ink); display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" glyph="chevron-down" size="22" hint-size="22px,22px"></dc-import></button>
<span style="flex: 1 1 auto; min-width: 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--st-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">מתנגן מ־[שם הפודקאסט]</span>
<button aria-label="אפשרויות הפרק" class="st-glass-thin" style="width: var(--st-touch); height: var(--st-touch); flex: 0 0 var(--st-touch); border: 0; border-radius: 50%; color: var(--st-ink); display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" glyph="more" size="22" hint-size="22px,22px"></dc-import></button>
</header>

<div style="position: absolute; top: 100px; right: 45px"><dc-import name="PodArt" size="300" tone="2" phone="true" hint-size="300px,300px"></dc-import></div>

<section aria-label="מתנגן עכשיו" style="position: absolute; top: 424px; right: var(--st-safe-x); left: var(--st-safe-x); display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: flex-start; gap: 8px">
<h1 style="flex: 1 1 auto; min-width: 0; margin: 0; font-size: 20px; font-weight: 800; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">[שם הפרק]</h1>
<button aria-label="הוספה למועדפים" aria-pressed="false" style="width: var(--st-touch); height: var(--st-touch); flex: 0 0 var(--st-touch); border: 0; border-radius: 50%; background: transparent; color: var(--st-ink-2); display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" glyph="star" size="24" hint-size="24px,24px"></dc-import></button>
</div>
<span class="st-t-meta">[שם הפודקאסט] · 2 בנובמבר</span>
<span style="display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 13px; font-weight: 600"><dc-import name="Icon" glyph="menu" size="16" hint-size="16px,16px"></dc-import>קטע 3 מתוך 7 · [שם הקטע]</span>
</section>

<div style="position: absolute; top: 534px; right: var(--st-safe-x); left: var(--st-safe-x); display: flex; flex-direction: column; gap: 6px">
<div role="slider" aria-label="מיקום בפרק" aria-valuemin="0" aria-valuemax="3760" aria-valuenow="2190" style="position: relative; height: 20px; display: flex; align-items: center">
<span aria-hidden="true" style="position: absolute; right: 0; left: 0; height: 4px; border-radius: 2px; background: var(--st-track)"></span>
<span aria-hidden="true" style="position: absolute; right: 0; width: 58%; height: 4px; border-radius: 2px; background: var(--st-ink)"></span>
<span aria-hidden="true" style="position: absolute; right: 58%; width: 16px; height: 16px; margin-right: -8px; border-radius: 50%; background: var(--st-ink); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5)"></span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--st-ink-2)"><span dir="ltr" class="st-num">36:30</span><span class="st-num">נותרו 26:10</span></div>
</div>

<div style="position: absolute; top: 594px; right: 0; left: 0; display: flex; align-items: center; justify-content: center; gap: 28px">
<button aria-label="15 שניות אחורה" style="position: relative; width: 56px; height: 56px; border: 0; border-radius: 50%; background: transparent; color: var(--st-ink); display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" glyph="skip-back" size="40" hint-size="40px,40px"></dc-import><span class="st-num" style="position: absolute; font-size: 12px; font-weight: 800">15</span></button>
<button aria-label="השהיה" style="width: 76px; height: 76px; border: 0; border-radius: 50%; background: var(--st-cue); color: var(--st-on-cue); box-shadow: var(--st-lift); display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" glyph="pause" size="32" hint-size="32px,32px"></dc-import></button>
<button aria-label="30 שניות קדימה" style="position: relative; width: 56px; height: 56px; border: 0; border-radius: 50%; background: transparent; color: var(--st-ink); display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" glyph="skip-fwd" size="40" hint-size="40px,40px"></dc-import><span class="st-num" style="position: absolute; font-size: 12px; font-weight: 800">30</span></button>
</div>

<div role="group" aria-label="עוד שליטה" style="position: absolute; top: 692px; right: var(--st-safe-x); left: var(--st-safe-x); display: flex; justify-content: space-between">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="4">
<button aria-pressed="{{t.pressed}}" style="width: 80px; height: 56px; border: 0; border-radius: 16px; background: {{t.bg}}; box-shadow: {{t.edge}}; color: {{t.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: var(--st-font-ui); font-size: 11px; font-weight: 600; cursor: pointer"><dc-import name="Icon" glyph="{{t.glyph}}" size="20" hint-size="20px,20px"></dc-import><span class="st-num" style="white-space: nowrap">{{t.label}}</span></button>
</sc-for>
</div>

<button aria-label="הבא בתור" class="st-glass-thin" style="position: absolute; bottom: 20px; right: var(--st-safe-x); left: var(--st-safe-x); height: 60px; box-sizing: border-box; padding: 0 10px 0 14px; border: 0; border-radius: 18px; display: flex; align-items: center; gap: 10px; color: var(--st-ink); font-family: var(--st-font-ui); text-align: right; cursor: pointer">
<dc-import name="PodArt" size="40" tone="1" phone="true" hint-size="40px,40px"></dc-import>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 11px; font-weight: 600; color: var(--st-ink-3)">הבא בתור · ועוד 2</span>
<span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[שם הפרק] · [שם הפודקאסט]</span>
</span>
<dc-import name="Icon" glyph="chevron-up" size="22" hint-size="22px,22px"></dc-import>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sleep":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // The phone player, opened from the mini player or a row. Cover, title with its star, show and date, the
    // current chapter (a tap lists them); a scrubber to drag; 15 back · play · 30 forward. Under them: speed,
    // the sleep timer (amber while it runs), the queue and the chapters. "הבא בתור" pulls up from the foot.
    const sleep = this.props.sleep === undefined ? true : (this.props.sleep === true || this.props.sleep === 'true');
    const T = (glyph, label, on) => ({ glyph: glyph, label: label, pressed: on ? 'true' : 'false',
      bg: on ? 'var(--st-current-glass)' : 'var(--st-card)', edge: on ? 'inset 0 0 0 1px var(--st-current-edge)' : 'var(--st-edge)',
      fg: on ? 'var(--st-cue)' : 'var(--st-ink)' });
    return {
      tools: [T('speed', '1.25×'), T('moon', sleep ? '18 דק׳' : 'טיימר שינה', sleep), T('queue', 'תור'), T('menu', 'קטעים')]
    };
  }
}
</script>
</body>
</html>
