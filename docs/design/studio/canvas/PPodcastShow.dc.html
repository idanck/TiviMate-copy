<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שידור טלפון — עמוד פודקאסט</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="studio-phone.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="st-screen" dir="rtl">
<div style="position: absolute; top: var(--st-safe-top); right: 0"><dc-import name="PTopBar" title="[שם הפודקאסט]" search="false" back="true" hint-size="390px,56px"></dc-import></div>

<header style="position: absolute; top: 92px; right: var(--st-safe-x); left: var(--st-safe-x); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 14px">
<dc-import name="PodArt" size="112" tone="2" phone="true" hint-size="112px,112px"></dc-import>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 20px; font-weight: 800; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">[שם הפודקאסט]</span>
<span class="st-t-caption">[מגיש או רשת] · תרבות וחברה</span>
<span class="st-t-caption">142 פרקים · כל יום ראשון</span>
</div>
</div>
<div style="display: flex; gap: 8px">
<dc-import name="PButton" label="בספרייה" glyph="check" variant="primary" size="m" hint-size="120px,44px"></dc-import>
<dc-import name="PButton" label="החדש" glyph="play" size="m" hint-size="96px,44px"></dc-import>
<span style="flex: 1 1 auto"></span>
<dc-import name="PButton" label="התראה על פרק חדש" glyph="bell" icon-only="true" size="m" hint-size="44px,44px"></dc-import>
<dc-import name="PButton" label="הגדרות הפודקאסט" glyph="settings" icon-only="true" size="m" hint-size="44px,44px"></dc-import>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--st-ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">[תיאור הפודקאסט מהפיד, עד שלוש שורות, ונגיעה פותחת את כולו]</p>
</header>

<div role="group" aria-label="סינון פרקים" style="position: absolute; top: 352px; right: var(--st-safe-x); left: 0; display: flex; gap: 8px; overflow: hidden">
<dc-import name="PChip" label="הכול" state="selected" hint-size="64px,44px"></dc-import>
<dc-import name="PChip" label="לא הושמעו" state="rest" hint-size="96px,44px"></dc-import>
<dc-import name="PChip" label="בהתקדמות" state="rest" hint-size="96px,44px"></dc-import>
<dc-import name="PChip" label="הורדו" state="rest" hint-size="70px,44px"></dc-import>
</div>

<section aria-label="פרקים" style="position: absolute; top: 406px; right: var(--st-safe-x); left: var(--st-safe-x); bottom: 92px; overflow: hidden; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<dc-import name="PPodEpisodeRow" item="{{r}}" art="false" width="358" hint-size="358px,104px"></dc-import>
</sc-for>
</section>

<div style="position: absolute; bottom: 16px; right: 0"><dc-import name="PNavBar" current="podcasts" hint-size="390px,72px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // A podcast on the phone: the same actions as on the television (kept in the library — amber, primary;
    // play the newest; new-episode notice; its settings), the description, and its episodes newest first.
    // The phone adds one filter, "הורדו": episodes kept on the phone for listening without a network.
    return {
      rows: [
        { title: '[שם הפרק] · פרק 114', meta: '9 בנובמבר', dur: '48 דק׳', status: 'new' },
        { title: '[שם הפרק] · פרק 113', meta: '2 בנובמבר', status: 'partial', pct: 58, left: 'נותרו 26 דק׳', dl: true },
        { title: '[שם הפרק] · פרק 112', meta: '26 באוקטובר', status: 'played', fav: true },
        { title: '[שם הפרק] · פרק 111', meta: '19 באוקטובר', status: 'played' }
      ]
    };
  }
}
</script>
</body>
</html>
