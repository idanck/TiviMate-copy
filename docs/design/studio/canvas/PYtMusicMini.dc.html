<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב טלפון — נגן מוזיקה מוקטן</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="studio-phone.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pm-eq{display:flex;align-items:flex-end;gap:2px;height:12px}
.pm-eq span{width:3px;border-radius:2px;background:var(--st-current);animation:pm-eq 1.1s ease-in-out infinite}
.pm-eq span:nth-child(2){animation-delay:-.35s}.pm-eq span:nth-child(3){animation-delay:-.7s}
@keyframes pm-eq{0%,100%{height:3px}50%{height:12px}}
@media (prefers-reduced-motion: reduce){.pm-eq span{animation:none;height:8px}}
</style>
</helmet>
<div style="width: 390px; box-sizing: border-box; padding: 0 12px; font-family: var(--st-font-ui); color: var(--st-ink)">
<div role="group" aria-label="מתנגן עכשיו" style="position: relative; height: 212px; box-sizing: border-box; padding: 4px; border-radius: 20px; background: #1E1A12; border: 1.5px solid rgba(255, 181, 71, 0.7); box-shadow: 0 0 0 4px rgba(255, 181, 71, 0.12), 0 10px 28px rgba(0, 0, 0, 0.8); display: flex; gap: 10px; overflow: hidden">
<div style="flex: 0 0 200px; width: 200px; height: 200px; border-radius: 16px; overflow: hidden">
<dc-import name="Picture" scene="talk" width="200" height="200" label="[נגן YouTube · 200×200]" hint-size="200px,200px"></dc-import>
</div>
<div style="flex: 1 1 auto; min-width: 0; padding: 8px 0 12px; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--st-current); white-space: nowrap"><span class="pm-eq" aria-hidden="true"><span></span><span></span><span></span></span>מתנגן</span>
<span style="font-size: 15px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">[שם השיר]</span>
<span style="font-size: 13px; color: var(--st-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[שם האמן]</span>
<div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
<button aria-label="למסך הנגן" style="width: var(--st-touch); height: var(--st-touch); border: 0; border-radius: 50%; background: transparent; color: var(--st-ink); display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" glyph="chevron-up" size="22" hint-size="22px,22px"></dc-import></button>
<button aria-label="השיר הבא" style="width: var(--st-touch); height: var(--st-touch); border: 0; border-radius: 50%; background: transparent; color: var(--st-ink); display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" glyph="skip-fwd" size="22" hint-size="22px,22px"></dc-import></button>
<button aria-label="השהיה" style="width: var(--st-touch); height: var(--st-touch); border: 0; border-radius: 50%; background: var(--st-current); color: var(--st-on-current); display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" glyph="pause" size="20" hint-size="20px,20px"></dc-import></button>
</div>
</div>
<span aria-hidden="true" style="position: absolute; bottom: 0; right: 214px; left: 0; height: 3px; background: rgba(255, 181, 71, 0.18)"><span style="display: block; height: 3px; width: 38%; background: var(--st-current)"></span></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":212}}'>
class Component extends DCLogic {
  renderVals() {
    // The music tab's mini player on the phone, in the amber frame of the radio and podcast mini players.
    // It cannot shrink to a 64px strip like theirs: it IS the YouTube player, which must stay visible, at
    // least 200×200, with nothing over it — so the frame sits at its start edge, 200×200, and the song and
    // buttons beside it. It docks above the bottom bar on every screen of the music tab; leaving YouTube
    // stops the song (no playing in the background). A tap or ˄ opens the player screen (PYtMusicPlayer).
    return {};
  }
}
</script>
</body>
</html>
