<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב — מצב ריק</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Karantina:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}; display: flex; flex-direction: column; align-items: center; gap: {{gap}}; text-align: center; font-family: var(--st-font-ui); color: var(--st-ink)">
<span style="width: {{ic}}; height: {{ic}}; border-radius: 50%; background: var(--st-card); color: var(--st-ink-2); display: flex; align-items: center; justify-content: center"><dc-import name="Icon" glyph="{{glyph}}" size="{{isz}}" hint-size="40px,40px"></dc-import></span>
<sc-if value="{{hasTitle}}" hint-placeholder-val="{{false}}"><span style="font-size: {{tfs}}; font-weight: 700">{{title}}</span></sc-if>
<span style="font-size: {{fs}}; line-height: 1.5; color: var(--st-ink-2)">{{text}}</span>
<sc-if value="{{hasAction}}" hint-placeholder-val="{{true}}"><div style="margin-top: {{amt}}"><dc-import name="Button" label="{{action}}" glyph="plus" size="m" focused="{{focused}}" hint-size="240px,64px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"glyph":{"editor":"text","default":"tv"},"title":{"editor":"text","default":""},"text":{"editor":"text","default":"עדיין אין ערוצים. הוסף רשימת השמעה בהגדרות."},"action":{"editor":"text","default":"הוספת רשימה"},"focused":{"editor":"boolean","default":true},"width":{"editor":"int","default":760,"min":200,"max":1400},"$preview":{"width":760,"height":380}}'>
class Component extends DCLogic {
  renderVals() {
    const PH = false;
    const action = this.props.action ?? 'הוספת רשימה';
    const title = this.props.title || '';
    return {
      glyph: this.props.glyph || 'tv', text: this.props.text ?? 'עדיין אין ערוצים. הוסף רשימת השמעה בהגדרות.',
      title: title, hasTitle: title !== '', action: action, hasAction: action !== '',
      focused: !PH && (this.props.focused === true || this.props.focused === 'true'),
      w: (Number(this.props.width) || (PH ? 300 : 760)) + 'px',
      gap: PH ? '10px' : '18px', ic: PH ? '64px' : '112px', isz: PH ? 30 : 52, tfs: PH ? '18px' : '32px', fs: PH ? '14px' : '26px', amt: PH ? '6px' : '12px'
    };
  }
}
</script>
</body>
</html>
