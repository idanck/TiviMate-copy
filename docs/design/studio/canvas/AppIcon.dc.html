<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב — אייקון האפליקציה</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Karantina:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{s}}; height: {{s}}; border-radius: {{r}}; overflow: hidden; box-shadow: {{sh}}; flex: 0 0 auto">
<sc-if value="{{va}}" hint-placeholder-val="{{true}}"><svg width="100%" height="100%" viewBox="{{vb}}" aria-label="אייקון שידור"><rect width="108" height="108" fill="#0B1424"></rect><circle cx="54" cy="54" r="31" fill="none" stroke="#FF5A5F" stroke-opacity="0.16" stroke-width="2"></circle><circle cx="54" cy="54" r="22" fill="none" stroke="#FF5A5F" stroke-opacity="0.34" stroke-width="2.5"></circle><circle cx="54" cy="54" r="12.5" fill="#FF5A5F"></circle></svg></sc-if>
<sc-if value="{{vb_}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="{{vb}}" aria-label="אייקון שידור"><rect width="108" height="108" fill="#0B1424"></rect><g fill="#F3F5F9"><rect x="33" y="44" width="9" height="30" rx="4.5"></rect><rect x="49.5" y="50" width="9" height="24" rx="4.5"></rect><rect x="66" y="36" width="9" height="38" rx="4.5"></rect><rect x="33" y="66" width="42" height="9" rx="4.5"></rect></g><circle cx="70.5" cy="27" r="4.5" fill="#FF5A5F"></circle></svg></sc-if>
<sc-if value="{{vc}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="{{vb}}" aria-label="אייקון שידור"><rect width="108" height="108" fill="#0B1424"></rect><rect x="24" y="31" width="60" height="40" rx="6" fill="#131B2B" stroke="#F3F5F9" stroke-width="3.5"></rect><rect x="40" y="57" width="36" height="8" rx="2" fill="#F3F5F9"></rect><rect x="72" y="57" width="4" height="8" fill="#FF5A5F"></rect><circle cx="76" cy="38.5" r="3.2" fill="#FF5A5F"></circle><rect x="45" y="76" width="18" height="3.5" rx="1.75" fill="#F3F5F9"></rect></svg></sc-if>
<sc-if value="{{vd}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="{{vb}}" aria-label="אייקון שידור"><rect width="108" height="108" fill="#FF5A5F"></rect><text x="54" y="70" text-anchor="middle" font-family="Karantina, sans-serif" font-weight="700" font-size="64" fill="#F3F5F9">ש</text><rect x="38" y="74" width="32" height="5" rx="2.5" fill="#080C14"></rect></svg></sc-if>
<sc-if value="{{vd2}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="{{vb}}" aria-label="אייקון שידור"><rect width="108" height="108" fill="#FF5A5F"></rect><text x="54" y="66" text-anchor="middle" font-family="Karantina, sans-serif" font-weight="700" font-size="60" fill="#F3F5F9">ש</text><rect x="0" y="73" width="108" height="10" fill="#080C14"></rect></svg></sc-if>
<sc-if value="{{vd3}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="{{vb}}" aria-label="אייקון שידור"><rect width="108" height="108" fill="#FF5A5F"></rect><circle cx="54" cy="54" r="29" fill="none" stroke="#F3F5F9" stroke-width="3"></circle><text x="54" y="69" text-anchor="middle" font-family="Karantina, sans-serif" font-weight="700" font-size="50" fill="#F3F5F9">ש</text><circle cx="54" cy="25" r="5" fill="#080C14"></circle></svg></sc-if>
<sc-if value="{{vd4}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="{{vb}}" aria-label="אייקון שידור"><rect width="108" height="108" fill="#0B1424"></rect><circle cx="54" cy="54" r="30" fill="#FF5A5F"></circle><text x="54" y="70" text-anchor="middle" font-family="Karantina, sans-serif" font-weight="700" font-size="52" fill="#F3F5F9">ש</text></svg></sc-if>
<sc-if value="{{vd5}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="{{vb}}" aria-label="אייקון שידור"><rect width="108" height="108" fill="#FF5A5F"></rect><text x="54" y="82" text-anchor="middle" font-family="Karantina, sans-serif" font-weight="700" font-size="84" fill="#F3F5F9">ש</text><circle cx="34" cy="33" r="6" fill="#080C14"></circle></svg></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["a","b","c","d","d2","d3","d4","d5"],"default":"a"},"shape":{"editor":"enum","options":["circle","squircle","rounded","full"],"default":"circle"},"size":{"editor":"int","default":192,"min":24,"max":512},"$preview":{"width":192,"height":192}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'a';
    const shape = this.props.shape || 'circle';
    const s = Number(this.props.size) || 192;
    const R = { circle: '50%', squircle: '34%', rounded: '22%', full: '0' }[shape] || '50%';
    // An adaptive icon is drawn on 108dp and the launcher shows the middle 72dp through its mask.
    const vb = shape === 'full' ? '0 0 108 108' : '18 18 72 72';
    return { s: s + 'px', r: R, vb: vb, sh: '0 6px 18px rgba(0,0,0,0.35)', va: v === 'a', vb_: v === 'b', vc: v === 'c', vd: v === 'd', vd2: v === 'd2', vd3: v === 'd3', vd4: v === 'd4', vd5: v === 'd5' };
  }
}
</script>
</body>
</html>
