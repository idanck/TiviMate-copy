<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פודקאסטים — מתנגן עכשיו</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="st-screen st-amb-tone" dir="rtl">

<div aria-hidden="true" class="st-amb-x" style="position: absolute; left: 840px; top: -200px; width: 1200px; height: 1200px; pointer-events: none">
<div class="st-amb-y" style="width: 100%; height: 100%">
<div class="st-amb-hue" style="width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, var(--st-halo) 0%, rgba(70,112,196,0.14) 34%, rgba(70,112,196,0) 66%)"></div>
</div>
</div>

<div style="position: absolute; top: 48px; right: var(--st-safe-x); display: flex; align-items: center; gap: 14px">
<span class="st-glass-thin" style="height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: var(--st-r-pill); display: inline-flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700"><dc-import name="Icon" glyph="podcast" size="22" hint-size="22px,22px"></dc-import>פודקאסט</span>
<span class="st-t-meta">ממשיך להתנגן גם כשיוצאים מהמסך</span>
</div>
<span class="st-glass-thin st-num" style="position: absolute; top: 48px; left: var(--st-safe-x); height: 64px; box-sizing: border-box; padding: 0 26px; border-radius: var(--st-r-pill); display: flex; align-items: center; font-size: 30px; font-weight: 600">20:56</span>

<div style="position: absolute; top: 160px; right: 200px"><dc-import name="PodArt" size="440" tone="2" hint-size="440px,440px"></dc-import></div>

<section aria-label="מתנגן עכשיו" style="position: absolute; top: 172px; right: 712px; width: 1112px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 24px; font-weight: 600; color: var(--st-ink-2)">מתנגן עכשיו · [שם הפודקאסט]</span>
<h1 class="st-t-title" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">[שם הפרק]</h1>
<span class="st-t-meta">פרק 113 · 2 בנובמבר 2026</span>
<span style="display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 600; color: var(--st-ink)"><dc-import name="Icon" glyph="menu" size="24" hint-size="24px,24px"></dc-import>קטע 3 מתוך 7 · [שם הקטע]</span>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px">
<dc-import name="Progress" pct="{{pct}}" width="1112" size="m" hint-size="1112px,8px"></dc-import>
<div style="display: flex; justify-content: space-between; font-size: 22px; font-weight: 600"><span dir="ltr" class="st-num">36:30</span><span class="st-num" style="color: var(--st-ink-2)">נותרו 26:10</span></div>
</div>
<div style="display: flex; align-items: center; gap: 16px; margin-top: 16px">
<dc-import name="Button" label="15" glyph="skip-back" size="m" hint-size="120px,64px"></dc-import>
<dc-import name="Button" label="{{playLabel}}" glyph="{{playGlyph}}" size="l" icon-only="true" focused="{{playFocus}}" hint-size="80px,80px"></dc-import>
<dc-import name="Button" label="30" glyph="skip-fwd" size="m" hint-size="120px,64px"></dc-import>
<span aria-hidden="true" style="width: 1px; height: 40px; background: var(--st-hairline); margin: 0 6px"></span>
<dc-import name="Button" label="1.25×" glyph="speed" size="m" hint-size="160px,64px"></dc-import>
<dc-import name="Button" label="{{sleepLabel}}" glyph="moon" size="m" active="{{sleepOn}}" hint-size="190px,64px"></dc-import>
<dc-import name="Button" label="הפרק במועדפים" glyph="star" size="m" icon-only="true" active="false" hint-size="64px,64px"></dc-import>
</div>
</section>

<section aria-label="הבא בתור" style="position: absolute; top: 720px; right: var(--st-safe-x); width: 860px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px"><h2 class="st-t-h1">הבא בתור</h2><span class="st-t-caption">אחרי הפרק הזה, אוטומטית</span></div>
<sc-for list="{{queue}}" as="r" hint-placeholder-count="3">
<dc-import name="PodEpisodeRow" item="{{r}}" art="true" width="860" hint-size="860px,88px"></dc-import>
</sc-for>
</section>

<section aria-label="קטעים" style="position: absolute; top: 720px; left: var(--st-safe-x); width: 760px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px"><h2 class="st-t-h1">קטעים</h2><span class="st-t-caption">רק כשהמפיק מפרסם אותם בפיד</span></div>
<sc-for list="{{chapters}}" as="c" hint-placeholder-count="5">
<div style="height: 52px; box-sizing: border-box; padding: 0 20px; border-radius: 16px; background: {{c.bg}}; box-shadow: {{c.sh}}; display: flex; align-items: center; gap: 20px; color: {{c.fg}}">
<span dir="ltr" class="st-num" style="flex: 0 0 90px; font-size: 20px; font-weight: 600; text-align: right">{{c.at}}</span>
<span style="flex: 1 1 auto; min-width: 0; font-size: 22px; font-weight: {{c.fw}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.label}}</span>
</div>
</sc-for>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"playing":{"editor":"boolean","default":true},"sleep":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    // The player, full screen, with the radio's drifting backdrop (no picture to burn in, OLED-safe).
    // Cover where the radio has the station disc; the episode, where you are in it and the current chapter.
    // The transport: 15 back, play/pause (in focus on entry), 30 forward; then speed (0.8× to 2×, kept per
    // podcast), the sleep timer (amber while it runs: "נעצר בעוד 18 דק׳" or "בסוף הפרק") and the star.
    // Below: the queue (what plays next — added by hand, or the next episode of this podcast) and the
    // chapters, when the feed has them (podcast:chapters); the current one amber. Without chapters, that
    // column shows the episode's description.
    const off = (v) => v === false || v === 'false';
    const playing = !off(this.props.playing);
    const sleep = this.props.sleep === true || this.props.sleep === 'true';
    const R = (title, meta, dur, status, tone) => ({ title: title, meta: meta, dur: dur, status: status, tone: tone });
    const C = (at, label, state) => ({ at: at, label: label,
      bg: state === 'now' ? 'var(--st-current-glass)' : 'transparent',
      sh: state === 'now' ? 'inset 0 0 0 1px var(--st-current-edge)' : 'none',
      fg: state === 'now' ? 'var(--st-current)' : (state === 'past' ? 'var(--st-ink-3)' : 'var(--st-ink-2)'),
      fw: state === 'now' ? '700' : '500' });
    return {
      pct: 58,
      playGlyph: playing ? 'pause' : 'play', playLabel: playing ? 'השהיה' : 'המשך', playFocus: true,
      sleepOn: sleep, sleepLabel: sleep ? 'נעצר בעוד 18 דק׳' : 'טיימר שינה',
      queue: [
        R('[שם הפרק]', '[שם הפודקאסט] · היום', '48:12', 'new', '1'),
        R('[שם הפרק]', '[שם הפודקאסט] · אתמול', '32:05', 'new', '4'),
        R('[שם הפרק]', '[שם הפודקאסט] · יום ב׳', '1:10:00', 'rest', '5')
      ],
      chapters: [C('0:00', '[פתיחה]', 'past'), C('4:12', '[שם הקטע]', 'past'), C('21:30', '[שם הקטע]', 'now'), C('39:05', '[שם הקטע]', 'next'), C('51:40', '[שם הקטע]', 'next')]
    };
  }
}
</script>
</body>
</html>
