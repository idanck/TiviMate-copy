<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב — נגן מוזיקה מוקטן בטלוויזיה</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tm-eq{display:flex;align-items:flex-end;gap:3px;height:18px}
.tm-eq span{width:4px;border-radius:2px;background:var(--st-tally);animation:tm-eq 1.1s ease-in-out infinite}
.tm-eq span:nth-child(2){animation-delay:-.35s}.tm-eq span:nth-child(3){animation-delay:-.7s}
@keyframes tm-eq{0%,100%{height:5px}50%{height:18px}}
@media (prefers-reduced-motion: reduce){.tm-eq span{animation:none;height:12px}}
</style>
</helmet>
<section aria-label="מתנגן עכשיו" class="st-browse" dir="rtl" style="position: relative; width: 1920px; height: 248px; box-sizing: border-box; padding: 24px var(--st-inset-start) 24px var(--st-safe-x); background: var(--st-drawer); box-shadow: 0 -1px 0 var(--st-hairline), 0 -24px 60px rgba(0, 0, 0, 0.5); display: flex; align-items: center; gap: 40px; font-family: var(--st-font-ui); color: var(--st-ink)">
<div style="flex: 0 0 500px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; color: var(--st-ink-2)"><span class="tm-eq" aria-hidden="true"><span></span><span></span><span></span></span>מתנגן · [שם הפלייליסט]</span>
<span style="font-size: 32px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[שם השיר]</span>
<span class="st-t-meta" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[שם האמן]</span>
</div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 16px">
<span dir="ltr" class="st-num" style="font-size: 20px; font-weight: 600">1:24</span>
<div aria-hidden="true" style="flex: 1 1 auto; height: 6px; border-radius: 3px; background: var(--st-track); overflow: hidden"><div style="height: 6px; width: 38%; background: var(--st-ink)"></div></div>
<span dir="ltr" class="st-num st-t-caption">3:42</span>
</div>
<div style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px">
<dc-import name="Button" label="השיר הקודם" glyph="skip-back" size="m" icon-only="true" hint-size="64px,64px"></dc-import>
<dc-import name="Button" label="השהיה" glyph="pause" size="m" icon-only="true" focused="{{pauseFocus}}" hint-size="64px,64px"></dc-import>
<dc-import name="Button" label="השיר הבא" glyph="skip-fwd" size="m" icon-only="true" hint-size="64px,64px"></dc-import>
<dc-import name="Button" label="למסך הנגן" glyph="fullscreen" size="m" icon-only="true" focused="{{openFocus}}" hint-size="64px,64px"></dc-import>
</div>
<div style="flex: 0 0 356px; width: 356px; height: 200px; border-radius: 16px; overflow: hidden; box-shadow: var(--st-depth-2)">
<dc-import name="Picture" scene="talk" width="356" height="200" label="[נגן YouTube · 356×200 · לא מכוסה]" hint-size="356px,200px"></dc-import>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"focus":{"editor":"enum","options":["none","pause","open"],"default":"none"},"$preview":{"width":1920,"height":248}}'>
class Component extends DCLogic {
  renderVals() {
    // The mini player of the music tab on the television. YouTube may not play hidden and nothing may cover
    // its player, so the mini player IS the player: its frame shrinks to 356×200 (YouTube asks for at least
    // 200×200) at the end edge of an opaque strip at the foot of the screen, with what plays and the buttons
    // beside it, never over it. It sits under every part of the music tab while a song plays; the parts
    // above it scroll and stop short of it. ▼ from the last row reaches its buttons; OK on the frame's
    // button opens the full player (TvYtMusicPlayer). Leaving YouTube stops the music.
    const f = this.props.focus || 'none';
    return { pauseFocus: f === 'pause', openFocus: f === 'open' };
  }
}
</script>
</body>
</html>
