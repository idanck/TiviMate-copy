<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב — הודעה קצרה</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Karantina:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div role="status" class="st-panel" style="display: inline-flex; align-items: center; gap: {{gap}}; padding: {{pad}}; border-radius: {{r}}; font-family: var(--st-font-ui); color: var(--st-ink); box-shadow: inset 0 0 0 1px var(--st-hairline), var(--st-lift); max-width: {{mw}}">
<sc-if value="{{hasGlyph}}" hint-placeholder-val="{{true}}"><span style="flex: 0 0 auto; color: {{gc}}; display: flex"><dc-import name="Icon" glyph="{{glyph}}" size="{{isz}}" hint-size="24px,24px"></dc-import></span></sc-if>
<span style="font-size: {{fs}}; font-weight: 500; line-height: 1.35">{{text}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"text":{"editor":"text","default":"יחס תצוגה: מילוי"},"glyph":{"editor":"text","default":"aspect"},"tone":{"editor":"enum","options":["default","ok","error"],"default":"default"},"$preview":{"width":420,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    const PH = false;
    const tone = this.props.tone || 'default';
    const glyph = this.props.glyph ?? 'aspect';
    return {
      text: this.props.text ?? 'יחס תצוגה: מילוי', glyph: glyph, hasGlyph: !!glyph,
      gc: tone === 'ok' ? 'var(--st-ok)' : (tone === 'error' ? 'var(--st-error)' : 'var(--st-ink-2)'),
      gap: PH ? '10px' : '16px', pad: PH ? '12px 16px' : '20px 28px', r: PH ? '14px' : '18px',
      fs: PH ? '14px' : '24px', isz: PH ? 20 : 28, mw: PH ? '358px' : '1100px'
    };
  }
}
</script>
</body>
</html>
