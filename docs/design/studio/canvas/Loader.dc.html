<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב — טעינה</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Karantina:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<span role="progressbar" aria-label="{{label}}" class="st-spin" style="display: inline-block; width: {{s}}; height: {{s}}; box-sizing: border-box; border-radius: 50%; border: {{bw}} solid var(--st-track); border-top-color: var(--st-ink)"></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":64,"min":16,"max":160},"label":{"editor":"text","default":"טוען"},"$preview":{"width":64,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Number(this.props.size) || 64;
    return { s: s + 'px', bw: Math.max(3, Math.round(s / 14)) + 'px', label: this.props.label || 'טוען' };
  }
}
</script>
</body>
</html>
