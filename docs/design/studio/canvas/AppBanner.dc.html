<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב — אריח הטלוויזיה</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Karantina:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}; height: {{h}}; border-radius: {{r}}; overflow: hidden; flex: 0 0 auto">
<sc-if value="{{va}}" hint-placeholder-val="{{true}}"><svg width="100%" height="100%" viewBox="0 0 320 180" aria-label="אריח שידור"><rect width="320" height="180" fill="#0B1424"></rect><g transform="translate(206 36) scale(1)"><circle cx="54" cy="54" r="31" fill="none" stroke="#FF5A5F" stroke-opacity="0.16" stroke-width="2"></circle><circle cx="54" cy="54" r="22" fill="none" stroke="#FF5A5F" stroke-opacity="0.34" stroke-width="2.5"></circle><circle cx="54" cy="54" r="12.5" fill="#FF5A5F"></circle></g><text x="200" y="112" direction="rtl" text-anchor="start" font-family="Karantina, sans-serif" font-weight="700" font-size="76" fill="#F3F5F9">שידור</text></svg></sc-if>
<sc-if value="{{vb_}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="0 0 320 180" aria-label="אריח שידור"><rect width="320" height="180" fill="#0B1424"></rect><g transform="translate(196 34) scale(1.05)"><g fill="#F3F5F9"><rect x="33" y="44" width="9" height="30" rx="4.5"></rect><rect x="49.5" y="50" width="9" height="24" rx="4.5"></rect><rect x="66" y="36" width="9" height="38" rx="4.5"></rect><rect x="33" y="66" width="42" height="9" rx="4.5"></rect></g><circle cx="70.5" cy="27" r="4.5" fill="#FF5A5F"></circle></g><text x="212" y="112" direction="rtl" text-anchor="start" font-family="Karantina, sans-serif" font-weight="700" font-size="76" fill="#F3F5F9">שידור</text></svg></sc-if>
<sc-if value="{{vc}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="0 0 320 180" aria-label="אריח שידור"><rect width="320" height="180" fill="#0B1424"></rect><rect x="14" y="14" width="292" height="152" rx="12" fill="#131B2B" stroke="#F3F5F9" stroke-opacity="0.5" stroke-width="2"></rect><circle cx="290" cy="30" r="5" fill="#FF5A5F"></circle><rect x="96" y="108" width="196" height="42" rx="4" fill="#F3F5F9"></rect><rect x="284" y="108" width="8" height="42" fill="#FF5A5F"></rect><text x="276" y="140" direction="rtl" text-anchor="start" font-family="Karantina, sans-serif" font-weight="700" font-size="40" fill="#080C14">שידור</text></svg></sc-if>
<sc-if value="{{vd}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="0 0 320 180" aria-label="אריח שידור"><rect width="320" height="180" fill="#FF5A5F"></rect><text x="160" y="118" text-anchor="middle" font-family="Karantina, sans-serif" font-weight="700" font-size="96" fill="#F3F5F9">שידור</text><rect x="104" y="128" width="112" height="7" rx="3.5" fill="#080C14"></rect></svg></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["a","b","c","d"],"default":"a"},"width":{"editor":"int","default":320,"min":80,"max":1280},"radius":{"editor":"int","default":0,"min":0,"max":40},"$preview":{"width":320,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'a';
    const w = Number(this.props.width) || 320;
    return { w: w + 'px', h: Math.round(w * 9 / 16) + 'px', r: (Number(this.props.radius) || 0) + 'px', va: v === 'a', vb_: v === 'b', vc: v === 'c', vd: v === 'd' };
  }
}
</script>
</body>
</html>
