<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>YouTube · מוזיקה — בשבילך</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ym-eq{display:flex;align-items:flex-end;gap:3px;height:22px}
.ym-eq span{width:5px;border-radius:2px;background:var(--st-tally);animation:ym-eq 1.1s ease-in-out infinite}
.ym-eq span:nth-child(2){animation-delay:-.35s}.ym-eq span:nth-child(3){animation-delay:-.7s}
@keyframes ym-eq{0%,100%{height:6px}50%{height:22px}}
@media (prefers-reduced-motion: reduce){.ym-eq span{animation:none;height:14px}}
</style>
</helmet>
<div class="st-screen st-browse" dir="rtl">

<div style="position: absolute; top: 140px; right: var(--st-inset-start)"><dc-import name="YtSwitch" mode="music" section="home" focus="{{switchFocus}}" hint-size="1000px,64px"></dc-import></div>

<sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; top: 236px; left: var(--st-safe-x); width: 768px; height: 432px; border-radius: var(--st-r-card); overflow: hidden; box-shadow: var(--st-depth-2)">
<dc-import name="Picture" scene="talk" width="768" height="432" label="[נגן YouTube — השיר מתנגן כאן, ושום דבר שלנו לא מצויר מעליו]" hint-size="768px,432px"></dc-import>
</div>
</sc-if>
<sc-if value="{{idle}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; top: 236px; left: var(--st-safe-x)"><dc-import name="MusicArt" size="432" tone="3" kind="playlist" state="rest" hint-size="432px,432px"></dc-import></div>
</sc-if>

<sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
<section aria-label="מתנגן עכשיו" style="position: absolute; top: 244px; right: var(--st-inset-start); width: 832px; display: flex; flex-direction: column; gap: 16px">
<span style="display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 600; color: var(--st-ink-2)"><span class="ym-eq" aria-hidden="true"><span></span><span></span><span></span></span>מתנגן עכשיו · מהפלייליסט [שם הפלייליסט]</span>
<h1 class="st-t-title" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">[שם השיר]</h1>
<span style="font-size: 28px; font-weight: 600; color: var(--st-ink-2)">[שם האמן] · [שם האלבום]</span>
<div style="display: flex; align-items: center; gap: 18px; margin-top: 8px">
<span dir="ltr" class="st-num" style="font-size: 22px; font-weight: 600">1:24</span>
<dc-import name="Progress" pct="38" width="640" size="m" hint-size="640px,8px"></dc-import>
<span dir="ltr" class="st-num st-t-meta">3:42</span>
</div>
<div style="display: flex; align-items: center; gap: 16px; margin-top: 18px">
<dc-import name="Button" label="השיר הקודם" glyph="skip-back" size="m" icon-only="true" hint-size="64px,64px"></dc-import>
<dc-import name="Button" label="השהיה" glyph="pause" size="m" focused="{{heroFocus}}" hint-size="180px,64px"></dc-import>
<dc-import name="Button" label="השיר הבא" glyph="skip-fwd" size="m" icon-only="true" hint-size="64px,64px"></dc-import>
<dc-import name="Button" label="הבא בתור" glyph="queue" size="m" hint-size="200px,64px"></dc-import>
<dc-import name="Button" label="השיר באהבתי" glyph="star" size="m" icon-only="true" active="true" hint-size="64px,64px"></dc-import>
</div>
</section>
</sc-if>

<sc-if value="{{idle}}" hint-placeholder-val="{{false}}">
<section aria-label="המשך האזנה" style="position: absolute; top: 244px; right: var(--st-inset-start); width: 832px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 24px; font-weight: 600; color: var(--st-ink-2)">המשך האזנה · עצרת אתמול בטלפון</span>
<h1 class="st-t-title" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">[שם הפלייליסט]</h1>
<span style="font-size: 28px; font-weight: 600; color: var(--st-ink-2)">פלייליסט שלך · [מספר] שירים</span>
<span class="st-t-meta">השיר הבא: [שם השיר] · [שם האמן]</span>
<div style="display: flex; align-items: center; gap: 16px; margin-top: 18px">
<dc-import name="Button" label="המשך" glyph="play" size="m" focused="{{heroFocus}}" hint-size="160px,64px"></dc-import>
<dc-import name="Button" label="ערבוב" glyph="swap" size="m" hint-size="160px,64px"></dc-import>
<dc-import name="Button" label="לפלייליסט" glyph="queue" size="m" hint-size="200px,64px"></dc-import>
</div>
</section>
</sc-if>

<section aria-label="מדפים" style="position: absolute; top: 720px; left: 0; right: 0; bottom: 0; background: var(--st-ground); overflow: hidden">
<div style="padding-top: 10px; transform: translateY({{railShift}}); display: flex; flex-direction: column">
<sc-for list="{{rails}}" as="rail" hint-placeholder-count="4">
<div style="height: 350px; box-sizing: border-box; display: flex; flex-direction: column">
<div style="padding: 0 var(--st-inset-start) 0 var(--st-safe-x); margin-bottom: 18px; display: flex; align-items: baseline; gap: 16px">
<h2 class="st-t-h1">{{rail.title}}</h2>
<span class="st-t-caption">{{rail.caption}}</span>
</div>
<div style="display: flex; align-items: flex-start; gap: var(--st-gap-rail); padding: 20px var(--st-inset-start) 20px var(--st-safe-x); margin-top: -20px; overflow: hidden">
<sc-for list="{{rail.cards}}" as="c" hint-placeholder-count="7">
<div style="flex: 0 0 190px"><dc-import name="MusicCard" item="{{c}}" state="{{c.state}}" width="190" hint-size="190px,290px"></dc-import></div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</section>

<div style="position: absolute; inset: 0; pointer-events: none"><dc-import name="TvShell" current="youtube" topbar="true" menu="closed" hint-size="1920px,1080px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"playing":{"editor":"boolean","default":true},"scroll":{"editor":"enum","options":["top","second"],"default":"top"},"focus":{"editor":"enum","options":["hero","switch"],"default":"hero"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    // YouTube's screen with "מוזיקה" chosen at its top, part "בשבילך". Built like YouTube's video screen
    // (TvYouTube): the player in a frame of its own at the end edge, what plays beside it, never over it;
    // the bottom third is the same opaque panel that alone scrolls, rail by rail.
    // "playing: false" — nothing plays yet: no player at all (one starts only on OK), the frame's place
    // holds the art of what you stopped in, and "המשך" carries on from there, on any device of the account.
    // While a song plays and you move into the rails, the frame stays where it is and keeps playing.
    const p = this.props;
    const playing = !(p.playing === false || p.playing === 'false');
    const second = p.scroll === 'second';
    const C = (title, meta, tone, kind, o) => Object.assign({ title: title, meta: meta, tone: tone, kind: kind, state: 'rest' }, o || {});
    // "בחירה מהירה" is built by Shidur (12/11): from its own listening history, your likes (YouTube + Shidur)
    // and new uploads of the artists you subscribe to. With no history yet it is left out and "פופולרי עכשיו"
    // leads the panel.
    const quick = { title: 'בחירה מהירה', caption: 'מההיסטוריה שלך בשידור, מהלייקים ומהאמנים שלך', cards: [
      C('[שם השיר]', '[שם האמן]', '3', 'song', playing ? { state: 'onscreen' } : {}),
      C('[שם השיר]', '[שם האמן]', '1', 'song'), C('[שם השיר]', '[שם האמן]', '6', 'song'),
      C('[שם השיר]', '[שם האמן]', '4', 'song'), C('[שם השיר]', '[שם האמן]', '2', 'song'),
      C('[שם השיר]', '[שם האמן]', '5', 'song'), C('[שם השיר]', '[שם האמן]', '1', 'song')
    ] };
    const lists = { title: 'הפלייליסטים שלך', caption: 'מחשבון YouTube שחיברת', cards: [
      C('שירים שאהבתי', '[מספר] שירים', '6', 'playlist'), C('[שם הפלייליסט]', '[מספר] שירים', '3', 'playlist'),
      C('[שם הפלייליסט]', '[מספר] שירים', '1', 'playlist'), C('[שם הפלייליסט]', '[מספר] שירים', '4', 'playlist'),
      C('[שם הפלייליסט]', '[מספר] שירים', '2', 'playlist'), C('[שם הפלייליסט]', '[מספר] שירים', '5', 'playlist')
    ] };
    const artists = { title: 'האמנים שלך', caption: 'ערוצי האמנים שנרשמת אליהם', cards: [
      C('[שם האמן]', 'אמן', '1', 'artist'), C('[שם האמן]', 'אמן', '2', 'artist'), C('[שם האמן]', 'אמן', '3', 'artist'),
      C('[שם האמן]', 'אמן', '4', 'artist'), C('[שם האמן]', 'אמן', '5', 'artist'), C('[שם האמן]', 'אמן', '6', 'artist'),
      C('[שם האמן]', 'אמן', '1', 'artist')
    ] };
    const popular = { title: 'פופולרי עכשיו', caption: 'מוזיקה · ישראל', cards: [
      C('[שם השיר]', '[שם האמן]', '2', 'song'), C('[שם השיר]', '[שם האמן]', '4', 'song'), C('[שם השיר]', '[שם האמן]', '6', 'song'),
      C('[שם השיר]', '[שם האמן]', '1', 'song'), C('[שם השיר]', '[שם האמן]', '3', 'song'), C('[שם השיר]', '[שם האמן]', '5', 'song')
    ] };
    const rails = [quick, lists, artists, popular];
    if (second) {
      const r = rails[1];
      rails[1] = Object.assign({}, r, { cards: r.cards.map((c, i) => (i === 1 ? Object.assign({}, c, { state: 'focus' }) : c)) });
    }
    const sw = p.focus === 'switch';
    return {
      playing: playing, idle: !playing,
      heroFocus: !second && !sw, switchFocus: sw ? 'music' : '',
      railShift: second ? '-350px' : '0px',
      rails: rails
    };
  }
}
</script>
</body>
</html>
