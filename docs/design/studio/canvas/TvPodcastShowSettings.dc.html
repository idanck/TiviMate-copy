<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פודקאסטים — הגדרות פודקאסט</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="st-screen" dir="rtl">
<div style="position: absolute; inset: 0"><dc-import name="TvPodcastShow" focus="save" hint-size="1920px,1080px"></dc-import></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--st-dim-open)"></div>

<aside aria-label="הגדרות הפודקאסט" style="position: absolute; top: 0; left: 0; width: 720px; height: 1080px; box-sizing: border-box; padding: var(--st-safe-y) var(--st-safe-x) var(--st-safe-y) 40px; background: var(--st-drawer-end); box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.12), 40px 0 100px rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 20px; margin: 20px 0 28px">
<dc-import name="PodArt" size="96" tone="2" hint-size="96px,96px"></dc-import>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 30px; font-weight: 700">הגדרות הפודקאסט</span>
<span class="st-t-caption">[שם הפודקאסט] · חלות רק עליו, בכל המכשירים</span>
</div>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<dc-import name="ListRow" label="{{r.label}}" sub="{{r.sub}}" glyph="{{r.glyph}}" trail="{{r.trail}}" value="{{r.value}}" state="{{r.state}}" width="584" hint-size="584px,92px"></dc-import>
</sc-for>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    // The gear on a podcast's page. What a listener sets per show: speed, skipping a fixed intro and outro,
    // the new-episode notice, the order of its episodes, and when an episode counts as played. The general
    // defaults for all podcasts sit in Settings › ניגון; a value set here wins for this show only.
    const R = (label, glyph, trail, value, sub, state) => ({ label: label, glyph: glyph, trail: trail, value: value || '', sub: sub || '', state: state || 'rest' });
    return {
      rows: [
        R('מהירות ניגון', 'speed', 'value', '1.25×', '', 'focus'),
        R('דילוג על הפתיחה', 'skip-fwd', 'value', '30 שניות'),
        R('דילוג על הסיום', 'skip-fwd', 'value', 'כבוי'),
        R('התראה על פרק חדש', 'bell', 'on', ''),
        R('סדר הפרקים', 'move', 'value', 'מהחדש לישן'),
        R('נחשב כהושמע', 'played', 'value', 'כשנשארו 30 שניות'),
        R('הסרה מהספרייה', 'trash', 'none', '', 'הנקודות שבהן עצרת נשמרות, אם תחזור', 'danger')
      ]
    };
  }
}
</script>
</body>
</html>
