<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב — שדה קלט</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Karantina:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<label style="width: {{w}}; display: flex; flex-direction: column; gap: 10px; font-family: var(--st-font-ui); color: var(--st-ink)">
<sc-if value="{{hasLabel}}" hint-placeholder-val="{{true}}"><span style="font-size: 22px; font-weight: 600; color: var(--st-ink-2)">{{label}}</span></sc-if>
<span class="st-anim" style="height: 72px; box-sizing: border-box; padding: 0 22px; border-radius: var(--st-r-control); background: {{bg}}; box-shadow: {{shadow}}; color: var(--st-ink-2); display: flex; align-items: center; gap: 14px">
<sc-if value="{{hasIcon}}" hint-placeholder-val="{{false}}"><dc-import name="Icon" glyph="{{glyph}}" size="28" hint-size="28px,28px"></dc-import></sc-if>
<input class="st-input" dir="{{dir}}" value="{{value}}" placeholder="{{placeholder}}" readOnly="{{yes}}" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--st-ink); font-family: var(--st-font-ui); font-size: 26px">
</span>
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"כתובת הרשימה (M3U)"},"value":{"editor":"text","default":""},"placeholder":{"editor":"text","default":"https://"},"glyph":{"editor":"text","default":""},"state":{"editor":"enum","options":["rest","focus"],"default":"rest"},"ltr":{"editor":"boolean","default":false},"width":{"editor":"int","default":760,"min":240,"max":1728},"$preview":{"width":760,"height":110}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const focus = (p.state || 'rest') === 'focus';
    const label = p.label ?? 'כתובת הרשימה (M3U)';
    return {
      yes: true, label: label, hasLabel: label !== '',
      value: p.value || '', placeholder: p.placeholder ?? 'https://',
      glyph: p.glyph || '', hasIcon: !!p.glyph,
      dir: (p.ltr === true || p.ltr === 'true') ? 'ltr' : 'rtl',
      w: (Number(p.width) || 760) + 'px',
      bg: focus ? 'var(--st-card-focus)' : 'var(--st-surface)',
      shadow: focus ? '0 0 0 var(--st-ring) var(--st-cue)' : 'inset 0 0 0 1px var(--st-hairline)'
    };
  }
}
</script>
</body>
</html>
