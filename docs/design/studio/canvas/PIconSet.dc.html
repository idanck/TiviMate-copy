<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שידור טלפון — סט האייקונים</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="studio-phone.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Karantina:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div dir="rtl" style="width: 1280px; height: 1160px; box-sizing: border-box; padding: 40px 48px; background: var(--st-ground); color: var(--st-ink); font-family: var(--st-font-ui); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: baseline; gap: 20px"><h1 class="st-t-title" style="font-size: 64px">אייקונים · טלפון</h1><span class="st-t-meta" style="font-size: 16px">קו 2 בגריד 24, קצוות מעוגלים · מלא רק לניגון, השהיה, הקלטה ומועדף שסומן · גדלים 24 / 22 / 20 / 18</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<sc-for list="{{icons}}" as="i" hint-placeholder-count="43">
<div class="st-card" style="width: 150px; height: 124px; box-sizing: border-box; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center">
<dc-import name="Icon" glyph="{{i.g}}" size="24" hint-size="24px,24px"></dc-import>
<span dir="ltr" style="font-size: 13px; font-weight: 600">{{i.g}}</span>
<span dir="auto" style="font-size: 11px; line-height: 1.3; color: var(--st-ink-3)">{{i.m}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1160}}'>
class Component extends DCLogic {
  renderVals() { return { icons: [{"g": "play", "m": "PlayArrow, PlayCircle"}, {"g": "pause", "m": "Pause"}, {"g": "guide", "m": "DateRange"}, {"g": "star", "m": "StarBorder"}, {"g": "star-on", "m": "Star"}, {"g": "record", "m": "FiberManualRecord"}, {"g": "search", "m": "Search"}, {"g": "settings", "m": "Settings"}, {"g": "chevron-up", "m": "KeyboardArrowUp, SkipPrevious"}, {"g": "chevron-down", "m": "KeyboardArrowDown, SkipNext"}, {"g": "check", "m": "Check"}, {"g": "lock", "m": "Lock"}, {"g": "trash", "m": "Delete"}, {"g": "restart", "m": "Replay"}, {"g": "aspect", "m": "AspectRatio"}, {"g": "tv", "m": "LiveTv, Storage"}, {"g": "radio", "m": "Radio"}, {"g": "hide", "m": "VisibilityOff"}, {"g": "info", "m": "Info"}, {"g": "back", "m": "ArrowBack"}, {"g": "home", "m": "Home"}, {"g": "appearance", "m": "Palette"}, {"g": "network", "m": "Wifi"}, {"g": "backup", "m": "Backup"}, {"g": "pulse", "m": "BugReport"}, {"g": "close", "m": "Close"}, {"g": "history", "m": "History"}, {"g": "grid", "m": "SelectAll"}, {"g": "music", "m": "MusicNote"}, {"g": "movie", "m": "Movie"}, {"g": "fullscreen", "m": "Fullscreen"}, {"g": "storage", "m": "חדש — אין מקבילה בקוד"}, {"g": "bell", "m": "חדש — אין מקבילה בקוד"}, {"g": "rewind", "m": "חדש — אין מקבילה בקוד"}, {"g": "forward", "m": "חדש — אין מקבילה בקוד"}, {"g": "subtitles", "m": "חדש — אין מקבילה בקוד"}, {"g": "audio", "m": "חדש — אין מקבילה בקוד"}, {"g": "plus", "m": "חדש — אין מקבילה בקוד"}, {"g": "move", "m": "חדש — אין מקבילה בקוד"}, {"g": "alert", "m": "חדש — אין מקבילה בקוד"}, {"g": "update", "m": "חדש — אין מקבילה בקוד"}, {"g": "menu", "m": "חדש — אין מקבילה בקוד"}, {"g": "chevron-left", "m": "חדש — אין מקבילה בקוד"}] }; }
}
</script>
</body>
</html>
