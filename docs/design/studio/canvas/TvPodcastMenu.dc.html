<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פודקאסטים — אפשרויות פרק</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="st-screen" dir="rtl">
<div style="position: absolute; inset: 0"><dc-import name="TvPodcastShow" hint-size="1920px,1080px"></dc-import></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--st-dim-open)"></div>

<aside aria-label="אפשרויות הפרק" style="position: absolute; top: 0; left: 0; width: 720px; height: 1080px; box-sizing: border-box; padding: var(--st-safe-y) var(--st-safe-x) var(--st-safe-y) 40px; background: var(--st-drawer-end); box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.12), 40px 0 100px rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 20px; margin: 20px 0 28px">
<dc-import name="PodArt" size="96" tone="2" hint-size="96px,96px"></dc-import>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 26px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">[שם הפרק] · פרק 113</span>
<span class="st-t-caption">[שם הפודקאסט] · נותרו 26 דק׳</span>
</div>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<dc-import name="ListRow" label="{{r.label}}" sub="{{r.sub}}" glyph="{{r.glyph}}" trail="none" state="{{r.state}}" width="584" hint-size="584px,92px"></dc-import>
</sc-for>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    // A long OK on an episode, anywhere (a show's page, a rail, favourites, history, the queue): its options in
    // the end drawer, as a channel's are. Only what fits its state is offered — "המשך מ־" only when started,
    // "סימון כלא הושמע" in place of "סימון כהושמע" once played.
    const R = (label, glyph, sub, state) => ({ label: label, glyph: glyph, sub: sub || '', state: state || 'rest' });
    return {
      rows: [
        R('המשך מ־36:30', 'play', '', 'focus'),
        R('נגן מההתחלה', 'restart'),
        R('הוספה לתור', 'queue', 'אחרי מה שכבר בתור'),
        R('נגן אחרי הפרק הנוכחי', 'skip-fwd'),
        R('הוספה למועדפים', 'star'),
        R('סימון כהושמע', 'played', 'מוריד אותו מ"פרקים חדשים" ומ"המשך האזנה"'),
        R('פרטי הפרק', 'info', 'התיאור המלא, הקטעים והקישורים מהפיד')
      ]
    };
  }
}
</script>
</body>
</html>
