<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב — שורת שיר</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sr-eq{display:flex;align-items:flex-end;gap:3px;height:20px}
.sr-eq span{width:4px;border-radius:2px;background:var(--st-tally);animation:sr-eq 1.1s ease-in-out infinite}
.sr-eq span:nth-child(2){animation-delay:-.35s}.sr-eq span:nth-child(3){animation-delay:-.7s}
@keyframes sr-eq{0%,100%{height:5px}50%{height:20px}}
@media (prefers-reduced-motion: reduce){.sr-eq span{animation:none;height:12px}}
</style>
</helmet>
<button class="st-anim" style="width: {{w}}; height: 84px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 20px; display: flex; align-items: center; gap: 16px; background: {{bg}}; color: {{fg}}; box-shadow: {{sh}}; transform: {{tf}}; text-align: right; font-family: var(--st-font-ui); cursor: pointer">
<dc-import name="MusicArt" size="60" tone="{{tone}}" kind="{{kind}}" state="rest" hint-size="60px,60px"></dc-import>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</span>
<span style="font-size: 20px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{meta}}</span>
</span>
<sc-if value="{{on}}" hint-placeholder-val="{{false}}"><span class="sr-eq" role="img" aria-label="מתנגן"><span></span><span></span><span></span></span></sc-if>
<span class="st-num" style="flex: 0 0 auto; font-size: 20px; opacity: 0.8">{{dur}}</span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"state":{"editor":"enum","options":["rest","focus","onscreen"],"default":"rest"},"width":{"editor":"int","default":1000,"min":400,"max":1600},"$preview":{"width":1000,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    // One song in a list (search results, the queue, a playlist): art, title, artist with album, duration.
    // Focus: the lit surface. "onscreen": the song playing — tally wash, a red equaliser before the duration.
    const it = this.props.item || { title: '[שם השיר]', meta: '[שם האמן] · [שם האלבום]', dur: '3:42', tone: '1' };
    const s = this.props.state || it.state || 'rest';
    const f = s === 'focus', on = s === 'onscreen';
    return {
      w: (Number(this.props.width) || 1000) + 'px',
      tone: it.tone || '1', kind: it.kind || 'song', title: it.title, meta: it.meta, dur: it.dur || '', on: on,
      bg: f ? 'var(--st-light)' : (on ? 'var(--st-onscreen)' : 'transparent'),
      fg: f ? 'var(--st-on-cue)' : 'var(--st-ink)',
      sh: f ? 'var(--st-lift)' : (on ? 'inset 0 0 0 1px rgba(255, 90, 95, 0.45)' : 'none'),
      tf: f ? 'scale(var(--st-focus-scale-row))' : 'none'
    };
  }
}
</script>
</body>
</html>
