<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שידור טלפון — הקלטות</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="studio-phone.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Karantina:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="st-screen" dir="rtl">
<div style="position: absolute; top: var(--st-safe-top); right: 0"><dc-import name="PTopBar" title="הקלטות" search="false" back="false" hint-size="390px,56px"></dc-import></div>
<span class="st-t-caption" style="position: absolute; top: 84px; right: 32px">3 מתוזמנות · 3 הושלמו</span>
<section aria-label="רשימת הקלטות" style="position: absolute; top: 112px; right: var(--st-safe-x); width: 358px; display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0 0 2px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--st-ink-2)">מתוזמנות</h2>
<sc-for list="{{scheduled}}" as="r" hint-placeholder-count="3">
<dc-import name="PListRow" label="{{r.title}}" sub="{{r.sub}}" trail="status" value="{{r.status}}" tone="{{r.tone}}" width="358" hint-size="358px,64px"></dc-import>
</sc-for>
<h2 style="margin: 16px 0 2px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--st-ink-2)">הושלמו</h2>
<sc-for list="{{finished}}" as="r" hint-placeholder-count="3">
<dc-import name="PListRow" label="{{r.title}}" sub="{{r.sub}}" trail="status" value="{{r.status}}" tone="{{r.tone}}" width="358" hint-size="358px,64px"></dc-import>
</sc-for>
</section>
<div style="position: absolute; top: 700px; right: 0"><dc-import name="PMiniPlayer" channel="קשת 12" title="מהדורת החדשות המרכזית" pct="62" hint-size="390px,64px"></dc-import></div><div style="position: absolute; bottom: 0; right: 0"><dc-import name="PNavBar" current="recordings" hint-size="390px,72px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rec = (title, sub, status, tone) => ({ title: title, sub: sub, status: status, tone: tone });
    return {
      scheduled: [
        rec('מהדורת החדשות המרכזית', 'קשת 12 · היום 20:00–21:30', 'מקליט', 'tally'),
        rec('סרט עלילתי', 'כאן 11 · היום 21:45–23:30', 'מתוזמנת', 'muted'),
        rec('תחקיר', 'ערוץ 13 · מחר 21:00–22:15', 'מתוזמנת', 'muted')
      ],
      finished: [
        rec('מגזין ערב', 'קשת 12 · אתמול 21:30–23:00', 'הושלמה', 'ok'),
        rec('סרט תיעודי', 'כאן חינוכית · אתמול 22:00–23:00', 'חלקית', 'muted'),
        rec('דיון במליאה', 'ערוץ הכנסת · שלישי 13.10 19:00–23:00', 'נכשלה', 'error')
      ]
    };
  }
}
</script>
</body>
</html>
