<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שידור — הגדרות, חשבון</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="st-screen st-browse" dir="rtl">

<div style="position: absolute; top: 160px; right: var(--st-inset-start)"><dc-import name="SettingsNav" current="account" hint-size="560px,866px"></dc-import></div>
<section aria-label="חשבון" style="position: absolute; top: 160px; right: 776px; width: 1048px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; gap: 16px; padding: 0 24px 14px">
<h2 class="st-t-h1">חשבון</h2>
<span class="st-t-caption">הגדרות › חשבון</span>
</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<sc-if value="{{it.isHead}}" hint-placeholder-val="{{false}}"><span style="display: block; padding: {{it.pad}}; font-size: 22px; font-weight: 600; color: var(--st-ink-2)">{{it.label}}</span></sc-if>
<sc-if value="{{it.isHint}}" hint-placeholder-val="{{false}}"><span style="display: block; padding: 4px 24px 8px; font-size: 20px; font-weight: 400; line-height: 1.5; color: var(--st-ink-2)">{{it.label}}</span></sc-if>
<sc-if value="{{it.isRow}}" hint-placeholder-val="{{true}}"><dc-import name="ListRow" label="{{it.label}}" sub="{{it.sub}}" glyph="{{it.glyph}}" trail="{{it.trail}}" value="{{it.value}}" tone="{{it.tone}}" state="{{it.state}}" width="1048" hint-size="1048px,92px"></dc-import></sc-if>
</sc-for>
</section>
<div style="position: absolute; inset: 0; pointer-events: none"><dc-import name="TvShell" current="settings" hint-size="1920px,1080px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"youtube":{"editor":"enum","options":["connected","reconnect","none","signedout"],"default":"connected"},"focus":{"editor":"enum","options":["none","switch","disconnect","connect"],"default":"switch"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    // Settings › חשבון (ADR-059) with the YouTube account under Shidur's. The same account window as on
    // YouTube's screen, as rows: who is connected and what it may do (a status pill: green when connected,
    // grey when read only — never red, which is kept for live), then the actions. "החלפת חשבון" / "חיבור מחדש" / "חיבור חשבון YouTube" open the connect
    // window (TvYouTubeConnect) over Settings; "ניתוק" opens the same confirmation as on YouTube's screen.
    // signedout — no Shidur account on this device: YouTube cannot be connected (the token is kept by the
    // account), and the block says so under the sign-in.
    const p = this.props;
    const yt = p.youtube || 'connected';
    const foc = p.focus || 'switch';
    const H = (label, first) => ({ isHead: true, label: label, pad: first ? '0 24px 4px' : '22px 24px 4px' });
    const T = (label) => ({ isHint: true, label: label });
    const R = (label, o) => Object.assign({ isRow: true, label: label, sub: '', glyph: '', trail: 'none', value: '', tone: 'muted', state: 'rest' }, o || {});
    const items = [];
    if (yt === 'signedout') {
      items.push(H('שידור', true), R('לא מחובר', { sub: 'התחבר עם Google כדי לקשר את המכשיר לחשבון שלך.' }),
        R('כניסה עם קוד מהטלפון', { glyph: 'link', trail: 'chevron', state: 'focus' }));
      items.push(H('YouTube'), T('חשבון YouTube מתחבר לחשבון שידור. אחרי הכניסה לשידור אפשר לחבר אותו כאן או במסך YouTube.'));
    } else {
      items.push(H('שידור', true), R('[השם בחשבון Google]', { sub: '[כתובת הדוא״ל]' }),
        R('התנתקות', { sub: 'רק במכשיר הזה. הפלייליסטים וההגדרות נשארים כאן.' }),
        R('מחיקת החשבון', { sub: 'מוחק את החשבון ואת כל מה שנשמר בו בשרת, בכל המכשירים.', state: 'danger' }));
      items.push(H('YouTube'));
      if (yt === 'none') {
        items.push(R('חיבור חשבון YouTube', { sub: 'בשביל המנויים, הפלייליסטים והשירים שאהבת', glyph: 'plus', trail: 'chevron', state: foc === 'connect' || foc === 'switch' ? 'focus' : 'rest' }));
      } else {
        const re = yt === 'reconnect';
        items.push(R('[שם הערוץ]', { sub: re ? 'לייקים נשמרים רק בשידור' : 'לייקים נשלחים גם ל־YouTube', glyph: 'account', trail: 'status', tone: re ? 'muted' : 'ok', value: re ? 'קריאה בלבד' : 'מחובר' }));
        items.push(R(re ? 'חיבור מחדש' : 'החלפת חשבון', { sub: re ? 'כדי לאשר לשידור לסמן לייקים ב־YouTube' : 'מחברים חשבון YouTube אחר במקום הזה', glyph: re ? 'link' : 'swap', trail: 'chevron', state: foc === 'switch' ? 'focus' : 'rest' }));
        items.push(R('ניתוק', { sub: 'בכל המכשירים של חשבון שידור. החשבון ב־YouTube לא משתנה.', state: foc === 'disconnect' ? 'focus' : 'danger' }));
      }
    }
    return { items: items };
  }
}
</script>
</body>
</html>
