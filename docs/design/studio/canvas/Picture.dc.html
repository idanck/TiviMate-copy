<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב — תמונת שידור</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Karantina:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: {{w}}; height: {{h}}; overflow: hidden; border-radius: {{r}}; background: {{base}}; font-family: var(--st-font-ui)">
<sc-if value="{{studio}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 62%; height: 100%; background: #16223A"></div>
<div aria-hidden="true" style="position: absolute; left: 7%; top: 16%; width: 34%; height: 46%; border-radius: 6px; background: #1F3050"></div>
<div aria-hidden="true" style="position: absolute; left: 13%; top: 25%; width: 22%; height: 26%; border-radius: 4px; background: #2A3F68"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 60%; width: 70%; height: 9%; background: #1C2436"></div>
</sc-if>
<sc-if value="{{talk}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 46%; height: 100%; background: #261F2F"></div>
<div aria-hidden="true" style="position: absolute; left: 18%; top: 14%; width: 16%; height: 52%; border-radius: 120px 120px 8px 8px; background: #3A2E3F"></div>
<div aria-hidden="true" style="position: absolute; left: 52%; top: 20%; width: 15%; height: 46%; border-radius: 120px 120px 8px 8px; background: #33293A"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 58%; width: 100%; height: 12%; background: #2B2333"></div>
</sc-if>
<sc-if value="{{hasLabel}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; left: {{inset}}; top: {{top}}; display: flex; align-items: center; gap: 10px; font-size: {{fs}}; color: #9AA3B5"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM10 9.5v5l4-2.5z"></path></svg>{{label}}</span>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","options":["studio","talk","neutral"],"default":"studio"},"width":{"editor":"int","default":640,"min":120,"max":1920},"height":{"editor":"int","default":360,"min":68,"max":1080},"label":{"editor":"text","default":"[תמונת השידור]"},"radius":{"editor":"int","default":0,"min":0,"max":40},"$preview":{"width":640,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    const scene = this.props.scene || 'studio';
    const w = Number(this.props.width) || 640;
    const label = this.props.label ?? '[תמונת השידור]';
    const big = w >= 1200;
    return {
      w: w + 'px', h: (Number(this.props.height) || 360) + 'px',
      r: (Number(this.props.radius) || 0) + 'px',
      base: scene === 'talk' ? '#1E1A26' : '#111A2A',
      studio: scene === 'studio', talk: scene === 'talk',
      label: label, hasLabel: label !== '',
      inset: big ? '96px' : (w <= 420 ? '12px' : '16px'), top: big ? '170px' : (w <= 420 ? '12px' : '16px'), fs: big ? '20px' : (w <= 420 ? '13px' : '18px')
    };
  }
}
</script>
</body>
</html>
