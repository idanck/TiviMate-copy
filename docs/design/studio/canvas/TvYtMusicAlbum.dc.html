<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>YouTube · מוזיקה — עמוד אלבום</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="st-screen st-browse" dir="rtl">

<div style="position: absolute; top: 150px; right: var(--st-inset-start)"><dc-import name="MusicArt" size="360" tone="2" kind="album" state="rest" hint-size="360px,360px"></dc-import></div>

<section aria-label="האלבום" style="position: absolute; top: 160px; right: calc(var(--st-inset-start) + 416px); left: var(--st-safe-x); display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 24px; font-weight: 600; color: var(--st-ink-2)">אלבום · [שנה]</span>
<h1 class="st-t-title" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">[שם האלבום]</h1>
<span style="font-size: 28px; font-weight: 600; color: var(--st-ink-2)">[שם האמן]</span>
<span class="st-t-meta">[מספר] שירים · [משך]</span>
<div style="display: flex; align-items: center; gap: 16px; margin-top: 18px">
<dc-import name="Button" label="נגן" glyph="play" size="m" focused="{{playFocus}}" hint-size="140px,64px"></dc-import>
<dc-import name="Button" label="ערבוב" glyph="swap" size="m" hint-size="160px,64px"></dc-import>
<dc-import name="Button" label="{{saveLabel}}" glyph="star" size="m" active="{{saved}}" focused="{{saveFocus}}" hint-size="240px,64px"></dc-import>
<dc-import name="Button" label="לעמוד האמן" glyph="chevron-left" size="m" hint-size="220px,64px"></dc-import>
</div>
<sc-if value="{{showToast}}" hint-placeholder-val="{{false}}"><span class="st-t-caption" style="display: flex; align-items: center; gap: 8px"><dc-import name="Icon" glyph="check" size="22" hint-size="22px,22px"></dc-import>נשמר ב״הספרייה שלי ← אלבומים״ בכל המכשירים בחשבון</span></sc-if>
</section>

<section aria-label="שירי האלבום" style="position: absolute; top: 556px; right: var(--st-inset-start); left: var(--st-safe-x); height: 276px; overflow: hidden; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{songs}}" as="s" hint-placeholder-count="3">
<dc-import name="SongRow" item="{{s}}" state="{{s.state}}" width="1664" hint-size="1664px,84px"></dc-import>
</sc-for>
</section>

<div style="position: absolute; bottom: 0; left: 0"><dc-import name="TvMusicMini" focus="none" hint-size="1920px,248px"></dc-import></div>

<div style="position: absolute; inset: 0; pointer-events: none"><dc-import name="TvShell" current="youtube" topbar="true" menu="closed" hint-size="1920px,1080px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"saved":{"editor":"boolean","default":true},"focus":{"editor":"enum","options":["play","save"],"default":"save"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    // An album, reached from search or an artist's page. "שמירה בספרייה" is Shidur's own (decided 12/11):
    // YouTube's official API has no saved albums, so the album is kept in the Shidur account and shows up under
    // "הספרייה שלי ← אלבומים" on every device; it is not saved in YouTube Music.
    // Saved: the star turns amber and the label says so; OK again removes it.
    // Reading an album's songs through the official API is not verified yet (to be checked before building).
    const p = this.props;
    const saved = !(p.saved === false || p.saved === 'false');
    const f = p.focus || 'save';
    return {
      saved: saved, saveLabel: saved ? 'שמור בספרייה' : 'שמירה בספרייה',
      playFocus: f === 'play', saveFocus: f === 'save', showToast: saved && f === 'save',
      songs: [
        { title: '1. [שם השיר]', meta: '[שם האמן]', dur: '3:42', tone: '2', kind: 'album', state: 'onscreen' },
        { title: '2. [שם השיר]', meta: '[שם האמן]', dur: '4:11', tone: '2', kind: 'album', state: 'rest' },
        { title: '3. [שם השיר]', meta: '[שם האמן]', dur: '2:58', tone: '2', kind: 'album', state: 'rest' }
      ]
    };
  }
}
</script>
</body>
</html>
