<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>רכיב — שורה עליונה</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;family=Karantina:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="width: 1920px; height: 128px; box-sizing: border-box; padding: 0 var(--st-inset-start) 0 var(--st-safe-x); display: flex; align-items: center; justify-content: space-between; font-family: var(--st-font-ui); color: var(--st-ink)">
<div style="display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 50%; background: var(--st-tally)"></span>
<span style="font-family: var(--st-font-display); font-weight: 700; font-size: 64px; line-height: 1">שידור</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span class="st-num" style="font-size: 36px; font-weight: 600; line-height: 1">{{clock}}</span>
<span style="font-size: 20px; color: var(--st-ink-2)">{{date}}</span>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"clock":{"editor":"text","default":"20:56"},"date":{"editor":"text","default":"חמישי 15.10"},"$preview":{"width":1920,"height":128}}'>
class Component extends DCLogic {
  renderVals() {
    return { clock: this.props.clock ?? '20:56', date: this.props.date ?? 'חמישי 15.10' };
  }
}
</script>
</body>
</html>
