<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>YouTube · מוזיקה — רפרוף במדפים על כל המסך</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.yb-eq{display:flex;align-items:flex-end;gap:3px;height:18px}
.yb-eq span{width:4px;border-radius:2px;background:var(--st-tally);animation:yb-eq 1.1s ease-in-out infinite}
.yb-eq span:nth-child(2){animation-delay:-.35s}.yb-eq span:nth-child(3){animation-delay:-.7s}
@keyframes yb-eq{0%,100%{height:5px}50%{height:18px}}
@media (prefers-reduced-motion: reduce){.yb-eq span{animation:none;height:12px}}
</style>
</helmet>
<div class="st-screen st-browse" dir="rtl">

<section aria-label="מוזיקה" style="position: absolute; top: 140px; left: {{listLeft}}; right: 0; bottom: 0; overflow: hidden">
<div class="st-anim" style="transform: translateY({{shift}}); display: flex; flex-direction: column">

<div style="height: 88px; padding: 0 var(--st-inset-start) 0 {{padEnd}}; display: flex; align-items: flex-start; opacity: {{headOpacity}}">
<dc-import name="YtSwitch" mode="music" section="home" focus="{{switchFocus}}" hint-size="1000px,64px"></dc-import>
</div>

<sc-for list="{{rails}}" as="rail" hint-placeholder-count="5">
<div style="height: 300px; box-sizing: border-box; display: flex; flex-direction: column">
<div style="padding: 0 var(--st-inset-start) 0 {{padEnd}}; margin-bottom: 14px; display: flex; align-items: baseline; gap: 16px">
<h2 class="st-t-h1">{{rail.title}}</h2>
<span class="st-t-caption">{{rail.caption}}</span>
</div>
<div style="display: flex; align-items: flex-start; gap: var(--st-gap-rail); padding: 20px var(--st-inset-start) 20px {{padEnd}}; margin-top: -20px; overflow: hidden">
<sc-for list="{{rail.cards}}" as="c" hint-placeholder-count="9">
<div style="flex: 0 0 160px"><dc-import name="MusicCard" item="{{c}}" state="{{c.state}}" width="160" hint-size="160px,260px"></dc-import></div>
</sc-for>
</div>
</div>
</sc-for>

</div>
</section>

<sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
<section aria-label="מתנגן עכשיו" style="position: absolute; top: 140px; left: var(--st-safe-x); width: 712px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 712px; height: 400px; border-radius: var(--st-r-card); overflow: hidden; box-shadow: var(--st-depth-2)">
<dc-import name="Picture" scene="talk" width="712" height="400" label="[נגן YouTube · 356×200dp · לא מכוסה]" hint-size="712px,400px"></dc-import>
</div>
<span style="display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 22px; font-weight: 600; color: var(--st-ink-2)"><span class="yb-eq" aria-hidden="true"><span></span><span></span><span></span></span>מתנגן · [שם הפלייליסט]</span>
<span style="font-size: 40px; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[שם השיר]</span>
<span class="st-t-meta" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[שם האמן]</span>
<div style="display: flex; align-items: center; gap: 16px">
<span dir="ltr" class="st-num" style="font-size: 20px; font-weight: 600">1:24</span>
<div aria-hidden="true" style="flex: 1 1 auto; height: 6px; border-radius: 3px; background: var(--st-track); overflow: hidden"><div style="height: 6px; width: 38%; background: var(--st-ink)"></div></div>
<span dir="ltr" class="st-num st-t-caption">3:42</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 4px">
<dc-import name="Button" label="השיר הקודם" glyph="skip-back" size="m" icon-only="true" hint-size="64px,64px"></dc-import>
<dc-import name="Button" label="השהיה" glyph="pause" size="m" icon-only="true" focused="{{pauseFocus}}" hint-size="64px,64px"></dc-import>
<dc-import name="Button" label="השיר הבא" glyph="skip-fwd" size="m" icon-only="true" hint-size="64px,64px"></dc-import>
<dc-import name="Button" label="למסך הנגן" glyph="fullscreen" size="m" icon-only="true" hint-size="64px,64px"></dc-import>
</div>
</section>
</sc-if>

<div style="position: absolute; inset: 0; pointer-events: none"><dc-import name="TvShell" current="youtube" topbar="true" menu="closed" hint-size="1920px,1080px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"playing":{"editor":"boolean","default":true},"scroll":{"editor":"enum","options":["top","second","third"],"default":"top"},"focus":{"editor":"enum","options":["card","switch","column"],"default":"card"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    // Browsing alternative (12/11): no hero. The whole screen below the top bar is rails, and the whole list
    // scrolls — the switch and parts (YtSwitch) are just its first row, so ▼ from the first rail lets them
    // scroll away and every rail gets the top position in turn.
    // The player is never a hero here: while a song plays it is the mini player as the app builds it — a
    // column at the end edge, the frame 712×400 (356×200dp: YouTube's player is at least 200×200 in its own
    // CSS pixels, which are dp, so 400 here), the song and its buttons under it, nothing drawn over it. The
    // rails keep the whole height beside it. With nothing in the player there is no column and the rails run
    // to the edge; "המשך האזנה" becomes the first rail instead of a hero.
    const p = this.props;
    const playing = !(p.playing === false || p.playing === 'false');
    const step = p.scroll === 'third' ? 2 : (p.scroll === 'second' ? 1 : 0);
    const C = (title, meta, tone, kind, o) => Object.assign({ title: title, meta: meta, tone: tone, kind: kind, state: 'rest' }, o || {});
    const songs = (n, start) => Array.from({ length: n }, (_, i) => C('[שם השיר]', '[שם האמן]', String(((start + i) % 6) + 1), 'song'));
    const resume = { title: 'המשך האזנה', caption: 'מההיסטוריה שלך בשידור, בכל המכשירים', cards: [
      C('[שם הפלייליסט]', 'עצרת אתמול בטלפון', '3', 'playlist'),
      C('[שם האלבום]', '[שם האמן] · אלבום', '5', 'album'),
      C('שירים שאהבתי', '[מספר] שירים', '6', 'playlist'),
      C('[שם הפלייליסט]', '[מספר] שירים', '1', 'playlist'),
      C('[שם האלבום]', '[שם האמן] · אלבום', '2', 'album'),
      C('[שם הפלייליסט]', '[מספר] שירים', '4', 'playlist'),
      C('[שם האלבום]', '[שם האמן] · אלבום', '3', 'album'),
      C('[שם הפלייליסט]', '[מספר] שירים', '5', 'playlist'),
      C('[שם האלבום]', '[שם האמן] · אלבום', '1', 'album')
    ] };
    const quick = { title: 'בחירה מהירה', caption: 'מההיסטוריה, מהלייקים ומהאמנים שלך', cards: songs(9, 2) };
    const lists = { title: 'הפלייליסטים שלך', caption: 'מחשבון YouTube שחיברת', cards: [
      C('שירים שאהבתי', '[מספר] שירים', '6', 'playlist'), C('[שם הפלייליסט]', '[מספר] שירים', '3', 'playlist'),
      C('[שם הפלייליסט]', '[מספר] שירים', '1', 'playlist'), C('[שם הפלייליסט]', '[מספר] שירים', '4', 'playlist'),
      C('[שם הפלייליסט]', '[מספר] שירים', '2', 'playlist'), C('[שם הפלייליסט]', '[מספר] שירים', '5', 'playlist'),
      C('[שם הפלייליסט]', '[מספר] שירים', '3', 'playlist'), C('[שם הפלייליסט]', '[מספר] שירים', '1', 'playlist'),
      C('[שם הפלייליסט]', '[מספר] שירים', '6', 'playlist')
    ] };
    const artists = { title: 'האמנים שלך', caption: 'ערוצי האמנים שנרשמת אליהם', cards: Array.from({ length: 9 }, (_, i) => C('[שם האמן]', 'אמן', String((i % 6) + 1), 'artist')) };
    const popular = { title: 'פופולרי עכשיו', caption: 'מוזיקה · ישראל', cards: songs(9, 4) };
    // Playing: what plays already has the strip at the foot, so the list opens on quick picks.
    // Not playing: it opens on "המשך האזנה".
    const rails = playing ? [quick, lists, artists, popular] : [resume, quick, lists, artists, popular];
    if (playing) rails[0] = Object.assign({}, quick, { cards: quick.cards.map((c, i) => (i === 0 ? Object.assign({}, c, { state: 'onscreen' }) : c)) });
    const sw = p.focus === 'switch' && step === 0;
    const col = p.focus === 'column' && playing;
    if (!sw && !col) {
      const r = rails[step];
      const at = step === 0 && playing ? 1 : 0;
      rails[step] = Object.assign({}, r, { cards: r.cards.map((c, i) => (i === at ? Object.assign({}, c, { state: 'focus' }) : c)) });
    }
    return {
      playing: playing,
      // Beside the column: 96 + 712 + 48 — the rails are cut a gap short of it.
      listLeft: playing ? '856px' : '0px',
      padEnd: playing ? '0px' : 'var(--st-safe-x)',
      pauseFocus: col,
      // The focused rail rises to the top row; the switch row (88) leaves first.
      shift: step === 0 ? '0px' : '-' + (88 + (step - 1) * 300) + 'px',
      headOpacity: step === 0 ? '1' : '0',
      switchFocus: sw ? 'music' : '',
      rails: rails
    };
  }
}
</script>
</body>
</html>
