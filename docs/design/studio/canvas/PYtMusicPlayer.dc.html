<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שידור טלפון — YouTube · מוזיקה · נגן</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="studio-phone.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="st-screen" dir="rtl" style="background: #000">
<div style="position: absolute; top: var(--st-safe-top); right: 0"><dc-import name="PTopBar" title="מתנגן עכשיו" back="true" search="false" hint-size="390px,56px"></dc-import></div>

<div style="position: absolute; top: 92px; right: var(--st-safe-x); width: 358px; height: 202px; border-radius: 18px; overflow: hidden">
<dc-import name="Picture" scene="talk" width="358" height="202" label="[נגן YouTube · לא מכוסה]" hint-size="358px,202px"></dc-import>
</div>

<section aria-label="מתנגן עכשיו" style="position: absolute; top: 312px; right: var(--st-safe-x); left: var(--st-safe-x); display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: flex-start; gap: 10px">
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h1 class="st-t-title-s" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[שם השיר]</h1>
<span class="st-t-meta" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[שם האמן] · [שם האלבום]</span>
</div>
<button aria-label="השיר באהבתי" aria-pressed="true" style="flex: 0 0 var(--st-touch); width: var(--st-touch); height: var(--st-touch); border: 0; border-radius: 50%; background: var(--st-current-glass); box-shadow: inset 0 0 0 1px var(--st-current-edge); color: var(--st-cue); display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" glyph="star-on" size="22" hint-size="22px,22px"></dc-import></button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 14px">
<div aria-hidden="true" style="height: 4px; border-radius: 2px; background: var(--st-track); overflow: hidden"><div style="height: 4px; width: 38%; background: var(--st-ink)"></div></div>
<div style="display: flex; justify-content: space-between"><span dir="ltr" class="st-num st-t-caption">1:24</span><span dir="ltr" class="st-num st-t-caption">3:42</span></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px">
<dc-import name="PButton" label="ערבוב" glyph="swap" variant="ghost" size="l" icon-only="true" hint-size="52px,52px"></dc-import>
<dc-import name="PButton" label="השיר הקודם" glyph="skip-back" variant="secondary" size="l" icon-only="true" hint-size="52px,52px"></dc-import>
<dc-import name="PButton" label="השהיה" glyph="pause" variant="primary" size="xl" icon-only="true" hint-size="64px,64px"></dc-import>
<dc-import name="PButton" label="השיר הבא" glyph="skip-fwd" variant="secondary" size="l" icon-only="true" hint-size="52px,52px"></dc-import>
<dc-import name="PButton" label="חזרה על הפלייליסט" glyph="restart" variant="ghost" size="l" icon-only="true" hint-size="52px,52px"></dc-import>
</div>
</section>

<section aria-label="הבא בתור" style="position: absolute; top: 560px; right: var(--st-safe-x); left: var(--st-safe-x); display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px"><h2 class="st-t-h1">הבא בתור</h2><span class="st-t-caption">מהפלייליסט · [שם הפלייליסט]</span></div>
<sc-for list="{{queue}}" as="q" hint-placeholder-count="3">
<dc-import name="PSongRow" item="{{q}}" state="rest" width="358" hint-size="358px,60px"></dc-import>
</sc-for>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // The phone's music player: the YouTube frame across the top at its full width (358×202, never covered),
    // the song, the controls (all through the player's API) and the queue, which drags to reorder.
    // Back, or a swipe down, returns to the tab with the song in the mini player. No lock-screen card and no
    // background play: those would need the player hidden, which YouTube does not allow.
    return {
      queue: [
        { title: '[שם השיר]', meta: '[שם האמן]', tone: '1', kind: 'song' },
        { title: '[שם השיר]', meta: '[שם האמן]', tone: '5', kind: 'song' },
        { title: '[שם השיר]', meta: '[שם האמן]', tone: '2', kind: 'song' }
      ]
    };
  }
}
</script>
</body>
</html>
