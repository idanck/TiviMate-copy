name: webOS app

# Shidur for LG televisions, from webOS 5 (webos/, ADR-057): typecheck, tests, the build for
# Chromium 68 (every script ES2019 with nothing newer than Chromium 68, the JS service ES2017 for
# Node 8.12, the stylesheet with no CSS newer than Chromium 68), and the .ipk, kept as an artifact
# for installing on a television in developer mode. Also the bundle the installed shell downloads
# (ADR-057 0.4.0): its three files and bundle.json, kept as the artifact shidur-webos-bundle. Nothing
# is published from here: the Pi signs and publishes a bundle by hand (webos/tools/publish-bundle.sh),
# with a key that is never in CI, and LG reviews every store release by hand.
on:
  push:
    branches-ignore: ["apk", "apk-preview", "qa-results"]
    paths:
      - "webos/**"
      - "web/src/data/**"
      - ".github/workflows/webos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webos/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Includes test/parity.test.ts: the parsers in webos/src/data/ must be web/src/data/'s.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: The whole bundle, the guide worker and the service hold nothing newer than webOS 5
        run: npm run check:es

      - name: The stylesheet holds nothing newer than Chromium 68
        run: npm run check:css

      - name: The shell, and the bundle.json it is published by
        run: npm run check:shell

      - name: The publish script parses
        run: bash -n tools/publish-bundle.sh

      # Before the store build below replaces dist/.
      - uses: actions/upload-artifact@v4
        with:
          name: shidur-webos-bundle
          path: |
            webos/dist/style.css
            webos/dist/polyfills.js
            webos/dist/index.js
            webos/dist/bundle.json
          if-no-files-found: error

      - name: Package the app
        run: npm run package < /dev/null

      # The build for LG's store (ADR-057 0.4.0): a shell that only loads its packaged bundle, with
      # no update address, no public key and no download.
      - name: The store build does not update itself
        run: SHIDUR_SELF_UPDATE=0 npm run build && npm run check:es && node scripts/check-shell.mjs --store

      - name: The DevTools driver parses
        run: node --check tools/cdp.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: shidur-webos-ipk
          path: webos/ipk/com.idanck.shidur_*.ipk
          if-no-files-found: error
