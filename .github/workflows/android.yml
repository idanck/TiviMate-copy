name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stamp the build
        run: |
          echo "GIT_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintRelease
        continue-on-error: true

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect artefacts
        id: collect
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist
          echo "apk=$(ls dist/*.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tivicopy-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        # Only for the integration branch, so feature pushes do not create releases.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TiviCopy build ${{ github.run_number }}
          body: |
            Automated build of `${{ github.sha }}`.
            Install the APK below on the device; it is signed with the standard debug key,
            so enable "install from unknown sources" for the file manager you use.
          files: dist/*.apk
          draft: false
          prerelease: false
