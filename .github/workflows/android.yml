name: Android build

on:
  push:
    # Every branch except the one this workflow publishes APKs to, so a build cannot
    # trigger itself.
    branches-ignore: ["apk"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stamp the build
        run: |
          echo "GIT_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintRelease
        continue-on-error: true

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect artefacts
        id: collect
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -la dist
          echo "apk=$(ls dist/*.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tivicopy-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the APK to the apk branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(ls dist/*.apk | head -1)
          staging=$(mktemp -d)
          cp "$apk" "$staging/"
          cat > "$staging/README.md" <<EOF
          # Latest build

          Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\` at $(date -u '+%Y-%m-%d %H:%M UTC').

          This branch is force-pushed on every build and holds a single APK, so it can be
          fetched with git rather than through the Actions artefact API.
          EOF
          cd "$staging"
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "build: APK for ${GITHUB_SHA:0:8} (${GITHUB_REF_NAME})"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Publish release
        # Only for the integration branch, so feature pushes do not create releases.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TiviCopy build ${{ github.run_number }}
          body: |
            Automated build of `${{ github.sha }}`.
            Install the APK below on the device; it is signed with the standard debug key,
            so enable "install from unknown sources" for the file manager you use.
          files: dist/*.apk
          draft: false
          prerelease: false
