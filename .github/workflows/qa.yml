name: QA (emulators)

# The end-to-end QA run from docs/qa/QA-PLAN.md: a debug build driven on an Android TV emulator
# and a phone emulator against a mock IPTV provider. It publishes nothing to devices — the
# update manifest is android.yml's job alone — and only runs when the QA kit itself changes or
# when started by hand, because an emulator run costs about half an hour of runner time.
on:
  workflow_dispatch:
  push:
    branches-ignore: ["apk", "qa-results"]
    paths:
      - "qa/**"
      - ".github/workflows/qa.yml"

permissions:
  contents: write

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (debug)
        id: unit
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint (debug)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect build evidence
        if: always()
        run: |
          mkdir -p build-evidence
          cp app/build/outputs/apk/debug/*.apk build-evidence/ 2>/dev/null || true
          cp -r app/build/reports/tests build-evidence/unit-tests 2>/dev/null || true
          cp -r app/build/test-results build-evidence/test-results 2>/dev/null || true
          cp app/build/reports/lint-results-debug.* build-evidence/ 2>/dev/null || true
          echo "unit=${{ steps.unit.outcome }}" > build-evidence/outcomes.txt
          ls -la build-evidence

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-build
          path: build-evidence
          retention-days: 14

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - form: tv
            api: 34
            target: android-tv
            arch: x86
            profile: tv_1080p
          - form: phone
            api: 34
            target: google_apis
            arch: x86_64
            profile: pixel_6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: qa-build
          path: build-evidence

      - name: Free runner disk space
        # The emulator's userdata partition is allocated up front, and a stock runner can have as
        # little as 3 GB free — the first run died on "Not enough space to create userdata
        # partition". None of these toolchains are used by this job.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tools for the mock provider and the driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 -m pip install --quiet pillow

      - name: Generate test media
        run: bash qa/mock_provider/make_media.sh "$RUNNER_TEMP/media"

      - name: Run the scenarios on the ${{ matrix.form }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disk-size: 3000M
          # Audio stays on (no -noaudio): playback is verified partly through AudioService.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: bash qa/run_on_emulator.sh ${{ matrix.form }} "$(ls build-evidence/*.apk | head -1)" "qa-out/${{ matrix.form }}" "$RUNNER_TEMP/media"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.form }}
          path: qa-out/${{ matrix.form }}
          retention-days: 14

  publish:
    # Evidence goes to an orphan `qa-results` branch (force-pushed, like `apk`) so it can be read
    # with git from environments that cannot reach the Actions artefact storage.
    needs: [build, emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
      - name: Push the evidence to the qa-results branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          staging=$(mktemp -d)
          for d in all/qa-tv all/qa-phone; do
            [ -d "$d" ] && cp -r "$d" "$staging/$(basename "$d")"
          done
          mkdir -p "$staging/build"
          cp -r all/qa-build/unit-tests all/qa-build/outcomes.txt all/qa-build/lint-results-debug.* "$staging/build/" 2>/dev/null || true
          # Test-result XML is what the summary reads; the APK is not kept here.
          cp -r all/qa-build/test-results "$staging/build/" 2>/dev/null || true
          find "$staging" -name '*.db*' -delete
          cat > "$staging/README.md" <<EOF
          # QA evidence

          From \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`, run ${GITHUB_RUN_ID}, $(date -u '+%Y-%m-%d %H:%M UTC').
          See docs/qa/QA-PLAN.md on the source branch for what each scenario checks.
          EOF
          cd "$staging"
          git init -q -b qa-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "qa: evidence for ${GITHUB_SHA:0:8} (run ${GITHUB_RUN_ID})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" qa-results
