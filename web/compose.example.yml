# An example deployment. Copy next to a .env holding either the Firebase project (Google sign-in,
# subscribers only: SHIDUR_FIREBASE_PROJECT_ID and SHIDUR_FIREBASE_WEB_CONFIG, web/README.md) or
# SHIDUR_WEB_PASSWORD, then:
#   docker compose -f web/compose.example.yml up -d --build
# from the repository root. Put it behind HTTPS (a reverse proxy or a tunnel) before reaching it
# from outside the home network.
services:
  shidur-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: shidur-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      SHIDUR_FIREBASE_PROJECT_ID: ${SHIDUR_FIREBASE_PROJECT_ID:-}
      SHIDUR_FIREBASE_WEB_CONFIG: ${SHIDUR_FIREBASE_WEB_CONFIG:-}
      SHIDUR_WEB_PASSWORD: ${SHIDUR_WEB_PASSWORD:-}
      # Keeps sessions across restarts; without it a restart only makes the page sign in again.
      SHIDUR_WEB_SECRET: ${SHIDUR_WEB_SECRET:-}
