<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shidur spike</title>
    <link rel="stylesheet" href="spike.css" />
  </head>
  <body>
    <div id="frame">
      <header id="bar">
        <span id="modes"></span>
        <span id="clock">0</span>
      </header>
      <div id="list" tabindex="-1"><div id="rows"></div></div>
      <div id="stage"></div>
      <div id="strip"><div id="cells"></div></div>
      <pre id="diag"></pre>
      <div id="keys">▲▼ list · ◀▶ strip · OK full screen · Back leave full screen · red scale · green list · yellow 1/2/4 videos · blue video in/out of frame · 7 local/network video · 0 reload</div>
    </div>
    <script src="spike.js"></script>
  </body>
</html>
